name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository dependencies and configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan dependencies, configuration, and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  images:
    name: Container image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - image: python-worker
            context: python-worker
            dockerfile: python-worker/Dockerfile
          - image: dify-plugin-worker
            context: dify-plugin-worker
            dockerfile: dify-plugin-worker/Dockerfile
          - image: n8n-plugin-worker
            context: n8n-plugin-worker
            dockerfile: n8n-plugin-worker/Dockerfile
          - image: adapter-manager
            context: adapter-manager
            dockerfile: adapter-manager/Dockerfile
          - image: outbound-gateway
            context: outbound-gateway
            dockerfile: outbound-gateway/Dockerfile
          - image: caddy
            context: caddy
            dockerfile: caddy/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: >-
          docker build
          --file "${{ matrix.dockerfile }}"
          --tag "local/base-ai-${{ matrix.image }}:scan"
          "${{ matrix.context }}"

      - name: Scan image operating system and dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: local/base-ai-${{ matrix.image }}:scan
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
