# Caddy HTTPS 域名入口清单占位文件。
#
# APP_DOMAIN_FILE 留空时，Docker Compose 会只读挂载本文件。入口脚本不会在
# IP 模式下解析域名清单，因此必须保留下面的空列表，避免占位配置意外启用
# 示例域名。
#
# 启用域名证书模式时：
# 1. 将本文件复制到仓库外的部署配置目录，例如 /etc/base-ai/domains.yml。
# 2. 将 domains: [] 替换为文件末尾注释中的 domains 列表。
# 3. 在 .env 中同时配置 APP_DOMAIN_FILE、TLS_CERT_FILE 和 TLS_KEY_FILE。
# 4. 确保证书的 SAN 覆盖 domains 中的全部具体域名，证书文件包含完整链，
#    私钥为无交互密码的 PEM 文件。
# 5. 修改域名清单或更新证书后，执行 docker compose restart caddy。
#
# 配置约束：
# - 顶层只允许 domains 字段，每项必须是字符串。
# - 域名不能包含协议、端口、路径或通配符。
# - 域名会自动转为小写并去重。
# - 文件最大 64 KiB，最多配置 256 个域名，并且只能包含一个 YAML 文档。
domains: []

# 完整多域名示例（复制文件后取消注释，并删除上面的 domains: []）：
#
# domains:
#   # Web 管理界面
#   - ai.example.com
#
#   # 对外 API
#   - api.example.com
#
#   # 使用同一套应用入口和证书的其他域名
#   - console.example.com
