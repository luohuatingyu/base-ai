server:
  port: 8080
  max-http-request-header-size: ${APP_MAX_REQUEST_HEADER_SIZE:16KB}
  tomcat:
    max-http-form-post-size: ${APP_MAX_REQUEST_BYTES:20971520}
    max-swallow-size: ${APP_MAX_REQUEST_BYTES:20971520}

spring:
  application:
    name: base-ai-backend
  config:
    import: optional:file:${TRACE_TRACKING_EXCLUSIONS_FILE:/app/config/trace-tracking-exclusions.yml}
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:5s}
      repositories:
        enabled: false
app:
  logging:
    root-level: ${LOG_LEVEL:INFO}
    console-queue-capacity: ${LOG_CONSOLE_QUEUE_CAPACITY:8192}
  platform:
    code: ${APP_PLATFORM_CODE:ai-platform}
    name-en: ${APP_PLATFORM_NAME_EN:AI Platform}
    name-zh: ${APP_PLATFORM_NAME_ZH:AI平台}
    short-name: ${APP_PLATFORM_SHORT_NAME:AI}
  i18n:
    default-locale: ${APP_DEFAULT_LOCALE:en-US}
  config-encryption-key: ${APP_CONFIG_ENCRYPTION_KEY}
  mysql-database:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    maximum-pool-size: 20
    connection-timeout-ms: ${DATABASE_CONNECTION_TIMEOUT_MS:5000}
  postgresql-database:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    maximum-pool-size: ${POSTGRES_POOL_SIZE:10}
    connection-timeout-ms: ${DATABASE_CONNECTION_TIMEOUT_MS:5000}
  token:
    secret: ${APP_TOKEN_SECRET}
    expire-minutes: ${APP_TOKEN_EXPIRE_MINUTES:720}
  session-cookie:
    secure: ${APP_SESSION_COOKIE_SECURE:false}
  api-key:
    hash-secret: ${APP_API_KEY_HASH_SECRET:${APP_CONFIG_ENCRYPTION_KEY}}
  proxy:
    trusted-cidrs: ${APP_TRUSTED_PROXY_CIDRS:}
  login-security:
    account-ip-failures: ${APP_LOGIN_ACCOUNT_IP_FAILURES:5}
    ip-failures: ${APP_LOGIN_IP_FAILURES:20}
    window-minutes: ${APP_LOGIN_WINDOW_MINUTES:5}
    block-minutes: ${APP_LOGIN_BLOCK_MINUTES:15}
    password-min-length: ${APP_PASSWORD_MIN_LENGTH:12}
  resource-limits:
    request-max-bytes: ${APP_MAX_REQUEST_BYTES:20971520}
  seed:
    admin-username: ${APP_SEED_ADMIN_USERNAME:admin}
    admin-password: ${APP_SEED_ADMIN_PASSWORD}
    admin-password-sync-enabled: ${APP_SEED_ADMIN_PASSWORD_SYNC_ENABLED:false}
  python-worker:
    url: ${PYTHON_WORKER_URL:http://python-worker:8000}
    internal-token: ${PYTHON_WORKER_INTERNAL_TOKEN}
    java-instance-id: ${JAVA_INSTANCE_ID:java-backend-1}
  llm:
    route-health-check-enabled: ${LLM_ROUTE_HEALTH_CHECK_ENABLED:true}
    route-health-check-interval-ms: ${LLM_ROUTE_HEALTH_CHECK_INTERVAL_MS:3600000}
  trace-log:
    queue-capacity: ${TRACE_LOG_QUEUE_CAPACITY:10000}
    batch-size: ${TRACE_LOG_BATCH_SIZE:100}
    flush-interval-ms: ${TRACE_LOG_FLUSH_INTERVAL_MS:500}
    persist-level: ${TRACE_LOG_PERSIST_LEVEL:INFO}
    retention-days: ${TRACE_LOG_RETENTION_DAYS:7}
  trace-tracking:
    heartbeat-timeout-seconds: ${TRACE_HEARTBEAT_TIMEOUT_SECONDS:120}
    excluded-methods: GET,OPTIONS
    excluded-paths:
      - /api/auth/**
      - /api/open/**
      - /api/internal/**
      - /api/system/tasks/**
      - /api/mail/**
      - /api/workflow-hooks/**
  api-trigger:
    scheduler-pool-size: ${API_TRIGGER_SCHEDULER_POOL_SIZE:4}
    lock-seconds: ${API_TRIGGER_LOCK_SECONDS:300}
    result-max-length: ${API_TRIGGER_RESULT_MAX_LENGTH:2000}
    response-max-bytes: ${API_TRIGGER_RESPONSE_MAX_BYTES:2097152}
    request-body-max-bytes: ${API_TRIGGER_REQUEST_BODY_MAX_BYTES:1048576}
    metadata-max-length: ${API_TRIGGER_METADATA_MAX_LENGTH:65536}
    caddy-ca-file: ${API_TRIGGER_CADDY_CA_FILE:}
  workflow:
    executor-pool-size: ${WORKFLOW_EXECUTOR_POOL_SIZE:4}
    executor-queue-capacity: ${WORKFLOW_EXECUTOR_QUEUE_CAPACITY:400}
    max-nodes: ${WORKFLOW_MAX_NODES:100}
    max-iterations: ${WORKFLOW_MAX_ITERATIONS:100}
    max-agent-steps: ${WORKFLOW_MAX_AGENT_STEPS:20}
    max-recursion-depth: ${WORKFLOW_MAX_RECURSION_DEPTH:5}
    max-payload-bytes: ${WORKFLOW_MAX_PAYLOAD_BYTES:1048576}
    max-wait-seconds: ${WORKFLOW_MAX_WAIT_SECONDS:3600}
    max-execution-steps: ${WORKFLOW_MAX_EXECUTION_STEPS:1000}
    max-run-log-bytes: ${WORKFLOW_MAX_RUN_LOG_BYTES:10485760}
    lease-seconds: ${WORKFLOW_LEASE_SECONDS:60}
    webhook-max-body-bytes: ${WORKFLOW_WEBHOOK_MAX_BODY_BYTES:1048576}
    webhook-rate-limit-per-minute: ${WORKFLOW_WEBHOOK_RATE_LIMIT_PER_MINUTE:60}
    trigger-delivery-retention-days: ${WORKFLOW_TRIGGER_DELIVERY_RETENTION_DAYS:30}
    marketplace-n8n-url: ${WORKFLOW_MARKETPLACE_N8N_URL:https://n8n.io}
    marketplace-dify-url: ${WORKFLOW_MARKETPLACE_DIFY_URL:https://marketplace.dify.ai}
    marketplace-timeout-seconds: ${WORKFLOW_MARKETPLACE_TIMEOUT_SECONDS:8}
    marketplace-cache-seconds: ${WORKFLOW_MARKETPLACE_CACHE_SECONDS:300}
    marketplace-max-package-bytes: ${WORKFLOW_MARKETPLACE_MAX_PACKAGE_BYTES:5242880}
    marketplace-max-unpacked-bytes: ${WORKFLOW_MARKETPLACE_MAX_UNPACKED_BYTES:10485760}
    marketplace-max-package-files: ${WORKFLOW_MARKETPLACE_MAX_PACKAGE_FILES:128}
