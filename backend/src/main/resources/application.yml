server:
  port: 8080
  max-http-request-header-size: ${APP_MAX_REQUEST_HEADER_SIZE:16KB}
  tomcat:
    max-http-form-post-size: ${APP_MAX_REQUEST_BYTES:67108864}
    max-swallow-size: ${APP_MAX_REQUEST_BYTES:67108864}

# 生成媒体仅写入 public 前缀；凭据由容器环境注入。
oss:
  endpoint: ${OSS_ENDPOINT:}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  bucket-name: ${OSS_BUCKET_NAME:}
  prefix: ${OSS_PREFIX:public/}

spring:
  application:
    name: base-ai-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  config:
    import: optional:file:${TRACE_TRACKING_EXCLUSIONS_FILE:/app/config/trace-tracking-exclusions.yml}
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:5s}
      ssl:
        enabled: ${REDIS_SSL:true}
      repositories:
        enabled: false
app:
  logging:
    root-level: ${LOG_LEVEL:INFO}
    console-queue-capacity: ${LOG_CONSOLE_QUEUE_CAPACITY:8192}
  platform:
    code: ${APP_PLATFORM_CODE:ai-platform}
    name-en: ${APP_PLATFORM_NAME_EN:AI Platform}
    name-zh: ${APP_PLATFORM_NAME_ZH:AI平台}
    short-name: ${APP_PLATFORM_SHORT_NAME:AI}
  i18n:
    default-locale: ${APP_DEFAULT_LOCALE:en-US}
  config-encryption-key: ${APP_CONFIG_ENCRYPTION_KEY}
  config-encryption-keys: ${APP_CONFIG_ENCRYPTION_KEYS:}
  config-encryption-active-key-id: ${APP_CONFIG_ENCRYPTION_ACTIVE_KEY_ID:legacy}
  mysql-database:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    maximum-pool-size: ${MYSQL_POOL_SIZE:20}
    connection-timeout-ms: ${DATABASE_CONNECTION_TIMEOUT_MS:5000}
  mysql-migration-database:
    url: ${MYSQL_MIGRATION_URL:${MYSQL_URL}}
    username: ${MYSQL_MIGRATION_USERNAME:${MYSQL_USERNAME}}
    password: ${MYSQL_MIGRATION_PASSWORD:${MYSQL_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    maximum-pool-size: 2
    connection-timeout-ms: ${DATABASE_CONNECTION_TIMEOUT_MS:5000}
  postgresql-enabled: ${POSTGRES_ENABLED:false}
  postgresql-database:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    maximum-pool-size: ${POSTGRES_POOL_SIZE:10}
    connection-timeout-ms: ${DATABASE_CONNECTION_TIMEOUT_MS:5000}
  token:
    secret: ${APP_TOKEN_SECRET}
    expire-minutes: ${APP_TOKEN_EXPIRE_MINUTES:720}
  session-cookie:
    secure: ${APP_SESSION_COOKIE_SECURE:false}
  api-key:
    hash-secret: ${APP_API_KEY_HASH_SECRET}
  proxy:
    trusted-cidrs: ${APP_TRUSTED_PROXY_CIDRS:}
  login-security:
    account-ip-failures: ${APP_LOGIN_ACCOUNT_IP_FAILURES:5}
    ip-failures: ${APP_LOGIN_IP_FAILURES:20}
    window-minutes: ${APP_LOGIN_WINDOW_MINUTES:5}
    block-minutes: ${APP_LOGIN_BLOCK_MINUTES:15}
    password-min-length: ${APP_PASSWORD_MIN_LENGTH:12}
    secret-reveal-failures: ${APP_SECRET_REVEAL_FAILURES:5}
    secret-reveal-window-minutes: ${APP_SECRET_REVEAL_WINDOW_MINUTES:5}
    secret-reveal-block-minutes: ${APP_SECRET_REVEAL_BLOCK_MINUTES:15}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  resource-limits:
    request-max-bytes: ${APP_MAX_REQUEST_BYTES:67108864}
    authentication-request-max-bytes: ${APP_AUTH_REQUEST_MAX_BYTES:65536}
  document-parser:
    socket-path: ${DOCUMENT_PARSER_SOCKET:/run/document-parser/parser.sock}
    max-document-bytes: ${DOCUMENT_PARSER_MAX_BYTES:10485760}
    max-characters: ${DOCUMENT_PARSER_MAX_CHARACTERS:2000000}
  device-agent:
    nonce-ttl-seconds: ${DEVICE_AGENT_NONCE_TTL_SECONDS:600}
    signature-clock-skew-seconds: ${DEVICE_AGENT_SIGNATURE_CLOCK_SKEW_SECONDS:300}
    heartbeat-stale-seconds: ${DEVICE_AGENT_HEARTBEAT_STALE_SECONDS:180}
    pairing-ttl-seconds: ${DEVICE_AGENT_PAIRING_TTL_SECONDS:900}
    registry-default-port: ${DEVICE_AGENT_REGISTRY_DEFAULT_PORT:42314}
  seed:
    admin-username: ${APP_SEED_ADMIN_USERNAME:admin}
    admin-password: ${APP_SEED_ADMIN_PASSWORD}
    admin-password-file: ${APP_SEED_ADMIN_PASSWORD_FILE:/app/bootstrap/admin-password}
    admin-password-sync-enabled: ${APP_SEED_ADMIN_PASSWORD_SYNC_ENABLED:false}
  python-worker:
    url: ${PYTHON_WORKER_URL:http://python-worker:8000}
    internal-token: ${PYTHON_WORKER_INTERNAL_TOKEN}
    java-instance-id: ${JAVA_INSTANCE_ID:java-backend-1}
  llm:
    route-health-check-enabled: ${LLM_ROUTE_HEALTH_CHECK_ENABLED:true}
    route-health-check-interval-ms: ${LLM_ROUTE_HEALTH_CHECK_INTERVAL_MS:3600000}
  trace-log:
    queue-capacity: ${TRACE_LOG_QUEUE_CAPACITY:10000}
    batch-size: ${TRACE_LOG_BATCH_SIZE:100}
    flush-interval-ms: ${TRACE_LOG_FLUSH_INTERVAL_MS:500}
    persist-level: ${TRACE_LOG_PERSIST_LEVEL:INFO}
    retention-days: ${TRACE_LOG_RETENTION_DAYS:7}
  audit:
    operation-log-retention-days: ${AUDIT_OPERATION_LOG_RETENTION_DAYS:90}
  llm-usage:
    retention-days: ${LLM_USAGE_RETENTION_DAYS:90}
  trace-tracking:
    heartbeat-timeout-seconds: ${TRACE_HEARTBEAT_TIMEOUT_SECONDS:120}
    excluded-methods: GET,OPTIONS
    excluded-paths:
      - /api/auth/**
      - /api/open/**
      - /api/internal/**
      - /api/system/tasks/**
      - /api/mail/**

resilience4j:
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.lang.Exception
        ignoreExceptions:
          - java.lang.IllegalArgumentException
          - java.lang.IllegalStateException
    instances:
      pythonWorker:
        baseConfig: default
        maxAttempts: 3
        waitDuration: 1s
      externalApi:
        baseConfig: default
        maxAttempts: 2
        waitDuration: 500ms
  circuitbreaker:
    configs:
      default:
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 10
        slidingWindowSize: 100
        slidingWindowType: COUNT_BASED
    instances:
      pythonWorker:
        baseConfig: default
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 5
        slidingWindowSize: 50
      externalApi:
        baseConfig: default
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 20
