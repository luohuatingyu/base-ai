name: ${APP_PLATFORM_SHORT_NAME:?Set APP_PLATFORM_SHORT_NAME}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${CONTAINER_LOG_MAX_SIZE:-20m}
    max-file: ${CONTAINER_LOG_MAX_FILES:-5}

services:
  backend:
    build:
      context: ./backend
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-17@sha256:f58d59b6273e785ac0a4477f6e9b5ba1d7731c75b906c0f7b34076f1851318cc}
        JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:17-jre@sha256:e4f018a55645ad204892e44eb35437518d7e108ba2a2dce305024ab371d24876}
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    image: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-backend:latest
    container_name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-backend
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      MYSQL_URL: ${MYSQL_URL:?Set MYSQL_URL}
      MYSQL_USERNAME: ${MYSQL_USERNAME:?Set MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      POSTGRES_URL: ${POSTGRES_URL:?Set POSTGRES_URL}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:?Set POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-10}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
      REDIS_HOST: ${REDIS_HOST:?Set REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-5s}
      APP_TOKEN_SECRET: ${APP_TOKEN_SECRET:?Set APP_TOKEN_SECRET}
      APP_SESSION_COOKIE_SECURE: ${APP_SESSION_COOKIE_SECURE:-true}
      APP_PLATFORM_CODE: ${APP_PLATFORM_CODE:-ai-platform}
      APP_PLATFORM_NAME_EN: ${APP_PLATFORM_NAME_EN:-AI Platform}
      APP_PLATFORM_NAME_ZH: ${APP_PLATFORM_NAME_ZH:-AI平台}
      APP_PLATFORM_SHORT_NAME: ${APP_PLATFORM_SHORT_NAME:-AI}
      APP_DEFAULT_LOCALE: ${APP_DEFAULT_LOCALE:-en-US}
      APP_TOKEN_EXPIRE_MINUTES: ${APP_TOKEN_EXPIRE_MINUTES:-720}
      APP_SEED_ADMIN_USERNAME: ${APP_SEED_ADMIN_USERNAME:-admin}
      APP_SEED_ADMIN_PASSWORD: ${APP_SEED_ADMIN_PASSWORD:?Set APP_SEED_ADMIN_PASSWORD}
      APP_SEED_ADMIN_PASSWORD_SYNC_ENABLED: ${APP_SEED_ADMIN_PASSWORD_SYNC_ENABLED:-false}
      APP_CONFIG_ENCRYPTION_KEY: ${APP_CONFIG_ENCRYPTION_KEY:?Set APP_CONFIG_ENCRYPTION_KEY}
      APP_API_KEY_HASH_SECRET: ${APP_API_KEY_HASH_SECRET:-${APP_CONFIG_ENCRYPTION_KEY}}
      APP_TRUSTED_PROXY_CIDRS: ${APP_TRUSTED_PROXY_CIDRS:-${CADDY_INTERNAL_IP:-172.30.0.10}/32}
      APP_LOGIN_ACCOUNT_IP_FAILURES: ${APP_LOGIN_ACCOUNT_IP_FAILURES:-5}
      APP_LOGIN_IP_FAILURES: ${APP_LOGIN_IP_FAILURES:-20}
      APP_LOGIN_WINDOW_MINUTES: ${APP_LOGIN_WINDOW_MINUTES:-5}
      APP_LOGIN_BLOCK_MINUTES: ${APP_LOGIN_BLOCK_MINUTES:-15}
      APP_PASSWORD_MIN_LENGTH: ${APP_PASSWORD_MIN_LENGTH:-12}
      APP_MAX_REQUEST_BYTES: ${APP_MAX_REQUEST_BYTES:-20971520}
      APP_MAX_REQUEST_HEADER_SIZE: ${APP_MAX_REQUEST_HEADER_SIZE:-16KB}
      PYTHON_WORKER_URL: ${PYTHON_WORKER_URL:-http://python-worker:8000}
      PYTHON_WORKER_INTERNAL_TOKEN: ${PYTHON_WORKER_INTERNAL_TOKEN:?Set PYTHON_WORKER_INTERNAL_TOKEN}
      JAVA_INSTANCE_ID: ${JAVA_INSTANCE_ID:-java-backend-1}
      LLM_ROUTE_HEALTH_CHECK_ENABLED: ${LLM_ROUTE_HEALTH_CHECK_ENABLED:-true}
      LLM_ROUTE_HEALTH_CHECK_INTERVAL_MS: ${LLM_ROUTE_HEALTH_CHECK_INTERVAL_MS:-3600000}
      TRACE_LOG_PERSIST_LEVEL: ${TRACE_LOG_PERSIST_LEVEL:-INFO}
      TRACE_LOG_QUEUE_CAPACITY: ${TRACE_LOG_QUEUE_CAPACITY:-10000}
      TRACE_LOG_BATCH_SIZE: ${TRACE_LOG_BATCH_SIZE:-100}
      TRACE_LOG_FLUSH_INTERVAL_MS: ${TRACE_LOG_FLUSH_INTERVAL_MS:-500}
      TRACE_LOG_RETENTION_DAYS: ${TRACE_LOG_RETENTION_DAYS:-7}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_CONSOLE_QUEUE_CAPACITY: ${LOG_CONSOLE_QUEUE_CAPACITY:-8192}
      TRACE_HEARTBEAT_TIMEOUT_SECONDS: ${TRACE_HEARTBEAT_TIMEOUT_SECONDS:-120}
      TRACE_TRACKING_EXCLUSIONS_FILE: /app/config/trace-tracking-exclusions.yml
      API_TRIGGER_SCHEDULER_POOL_SIZE: ${API_TRIGGER_SCHEDULER_POOL_SIZE:-4}
      API_TRIGGER_LOCK_SECONDS: ${API_TRIGGER_LOCK_SECONDS:-300}
      API_TRIGGER_RESULT_MAX_LENGTH: ${API_TRIGGER_RESULT_MAX_LENGTH:-2000}
      API_TRIGGER_RESPONSE_MAX_BYTES: ${API_TRIGGER_RESPONSE_MAX_BYTES:-2097152}
      API_TRIGGER_REQUEST_BODY_MAX_BYTES: ${API_TRIGGER_REQUEST_BODY_MAX_BYTES:-1048576}
      API_TRIGGER_METADATA_MAX_LENGTH: ${API_TRIGGER_METADATA_MAX_LENGTH:-65536}
      API_TRIGGER_CADDY_CA_FILE: /app/caddy-public-ca/root.crt
      WORKFLOW_EXECUTOR_POOL_SIZE: ${WORKFLOW_EXECUTOR_POOL_SIZE:-4}
      WORKFLOW_MAX_NODES: ${WORKFLOW_MAX_NODES:-100}
      WORKFLOW_MAX_ITERATIONS: ${WORKFLOW_MAX_ITERATIONS:-100}
      WORKFLOW_MAX_AGENT_STEPS: ${WORKFLOW_MAX_AGENT_STEPS:-20}
      WORKFLOW_MAX_RECURSION_DEPTH: ${WORKFLOW_MAX_RECURSION_DEPTH:-5}
      WORKFLOW_MAX_PAYLOAD_BYTES: ${WORKFLOW_MAX_PAYLOAD_BYTES:-1048576}
    volumes:
      - ${TRACE_TRACKING_EXCLUSIONS_FILE:-./backend/config/trace-tracking-exclusions.yml}:/app/config/trace-tracking-exclusions.yml:ro
      - caddy-public-ca:/app/caddy-public-ca:ro
    depends_on:
      python-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/open/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
    stop_signal: SIGTERM
    stop_grace_period: 20s
    networks:
      - app-network

  python-worker:
    build:
      context: ./python-worker
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
    image: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-python-worker:latest
    container_name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-python-worker
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      BACKEND_URL: http://backend:8080
      PYTHON_WORKER_INTERNAL_TOKEN: ${PYTHON_WORKER_INTERNAL_TOKEN:?Set PYTHON_WORKER_INTERNAL_TOKEN}
      PYTHON_WORKER_INSTANCE_ID: ${PYTHON_WORKER_INSTANCE_ID:-python-worker-1}
      APP_PLATFORM_NAME_EN: ${APP_PLATFORM_NAME_EN:-AI Platform}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_LOG_CONTENT: ${LLM_LOG_CONTENT:-true}
      WORKER_MAX_REQUEST_BYTES: ${WORKER_MAX_REQUEST_BYTES:-20971520}
      LLM_RESPONSE_MAX_BYTES: ${LLM_RESPONSE_MAX_BYTES:-10485760}
      TRACE_LOG_PERSIST_LEVEL: ${TRACE_LOG_PERSIST_LEVEL:-INFO}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_signal: SIGTERM
    stop_grace_period: 20s
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43}
    image: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-frontend:latest
    container_name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-frontend
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: ${FRONTEND_BACKEND_URL:-http://backend:8080}
      APP_PLATFORM_CODE: ${APP_PLATFORM_CODE:-ai-platform}
      APP_PLATFORM_NAME_EN: ${APP_PLATFORM_NAME_EN:-AI Platform}
      APP_PLATFORM_NAME_ZH: ${APP_PLATFORM_NAME_ZH:-AI平台}
      APP_PLATFORM_SHORT_NAME: ${APP_PLATFORM_SHORT_NAME:-AI}
      APP_DEFAULT_LOCALE: ${APP_DEFAULT_LOCALE:-en-US}
      LLM_ROUTE_HEALTH_CHECK_ENABLED: ${LLM_ROUTE_HEALTH_CHECK_ENABLED:-true}
      LLM_ROUTE_HEALTH_CHECK_INTERVAL_MS: ${LLM_ROUTE_HEALTH_CHECK_INTERVAL_MS:-3600000}
      PORT: 8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
      args:
        CADDY_IMAGE: ${CADDY_IMAGE:-caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/alpine}
    image: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-caddy:latest
    container_name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-caddy
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      APP_HTTPS_SITES_FILE: ${APP_HTTPS_SITES_FILE:-}
      TLS_CERTS_DIR: ${TLS_CERTS_DIR:-}
      APP_HTTPS_IPS: ${APP_HTTPS_IPS:-}
      CADDY_HTTPS_SITES_FILE: /etc/caddy/https-sites.yml
      CADDY_TLS_ROOT: /etc/caddy/tls
      CADDY_LEARNED_HOSTS_FILE: /data/base-ai-tls/learned-hosts
      CADDY_CERT_CHECK_INTERVAL_SECONDS: ${TLS_CERT_CHECK_INTERVAL_SECONDS:-3600}
      CADDY_IP_MIN_ISSUE_INTERVAL_SECONDS: ${IP_CERT_MIN_ISSUE_INTERVAL_SECONDS:-5}
      CADDY_IP_MAX_LEARNED_HOSTS: ${IP_CERT_MAX_LEARNED_HOSTS:-32}
      CADDY_EXTERNAL_HTTP_PORT: ${HTTP_PORT:-81}
      CADDY_EXTERNAL_HTTPS_PORT: ${HTTPS_PORT:-444}
      APP_MAX_REQUEST_BYTES: ${APP_MAX_REQUEST_BYTES:-20971520}
    ports:
      - "${HTTP_PORT:-81}:80"
      - "${HTTPS_PORT:-444}:443"
      - "${HTTPS_PORT:-444}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${APP_HTTPS_SITES_FILE:-./caddy/https-sites-placeholder.yml}:/etc/caddy/https-sites.yml:ro
      - ${TLS_CERTS_DIR:-./caddy/tls-placeholder}:/etc/caddy/tls:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-public-ca:/public-ca
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null && wget -qO- http://127.0.0.1:2020/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
    stop_signal: SIGTERM
    stop_grace_period: 20s
    networks:
      app-network:
        ipv4_address: ${CADDY_INTERNAL_IP:-172.30.0.10}

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${APP_NETWORK_SUBNET:-172.30.0.0/24}

volumes:
  caddy-data:
  caddy-config:
  caddy-public-ca:
