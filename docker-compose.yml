name: ${APP_PLATFORM_SHORT_NAME:?Set APP_PLATFORM_SHORT_NAME}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${CONTAINER_LOG_MAX_SIZE:-20m}
    max-file: ${CONTAINER_LOG_MAX_FILES:-5}

services:
  document-parser:
    build:
      context: ./backend
      target: document-parser
      args:
        APP_IMAGE_REVISION: ${APP_IMAGE_REVISION:?Set APP_IMAGE_REVISION to Git commit}
        MAVEN_IMAGE: maven:3.9.9-eclipse-temurin-17@sha256:f58d59b6273e785ac0a4477f6e9b5ba1d7731c75b906c0f7b34076f1851318cc
        JRE_IMAGE: eclipse-temurin:17-jre@sha256:13cc28a6cc72a38ce1f00c906be3580c1a3e604b8984d694f369a96742abc93b
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    image: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-document-parser:${APP_IMAGE_REVISION:?Set APP_IMAGE_REVISION to Git commit}
    container_name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-document-parser
    restart: unless-stopped
    read_only: true
    mem_limit: ${DOCUMENT_PARSER_MEMORY_LIMIT:-384m}
    cpus: ${DOCUMENT_PARSER_CPU_LIMIT:-1.0}
    pids_limit: ${DOCUMENT_PARSER_PIDS_LIMIT:-64}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      DOCUMENT_PARSER_SOCKET: /run/document-parser/parser.sock
      DOCUMENT_PARSER_MAX_BYTES: ${DOCUMENT_PARSER_MAX_BYTES:-10485760}
      DOCUMENT_PARSER_MAX_CHARACTERS: ${DOCUMENT_PARSER_MAX_CHARACTERS:-2000000}
      DOCUMENT_PARSER_TIMEOUT_SECONDS: ${DOCUMENT_PARSER_TIMEOUT_SECONDS:-20}
      DOCUMENT_PARSER_CONCURRENCY: ${DOCUMENT_PARSER_CONCURRENCY:-2}
    volumes:
      - document-parser-control:/run/document-parser
    tmpfs:
      - /tmp:size=64m,mode=1700,uid=10001,gid=10001
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/document-parser/parser.sock"]
      interval: 10s
      timeout: 5s
      retries: 10
    network_mode: none

  backend:
    build:
      context: ./backend
      target: backend
      args:
        APP_IMAGE_REVISION: ${APP_IMAGE_REVISION:?Set APP_IMAGE_REVISION to Git commit}
        MAVEN_IMAGE: maven:3.9.9-eclipse-temurin-17@sha256:f58d59b6273e785ac0a4477f6e9b5ba1d7731c75b906c0f7b34076f1851318cc
        JRE_IMAGE: eclipse-temurin:17-jre@sha256:13cc28a6cc72a38ce1f00c906be3580c1a3e604b8984d694f369a96742abc93b
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    image: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-backend:${APP_IMAGE_REVISION:?Set APP_IMAGE_REVISION to Git commit}
    container_name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-backend
    restart: unless-stopped
    mem_limit: ${BACKEND_MEMORY_LIMIT:-2g}
    cpus: ${BACKEND_CPU_LIMIT:-2.0}
    pids_limit: ${BACKEND_PIDS_LIMIT:-512}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      MYSQL_URL: ${MYSQL_URL:?Set MYSQL_URL}
      MYSQL_USERNAME: ${MYSQL_USERNAME:?Set MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_POOL_SIZE: ${MYSQL_POOL_SIZE:-20}
      MYSQL_MIGRATION_URL: ${MYSQL_MIGRATION_URL:-${MYSQL_URL:?Set MYSQL_URL}}
      MYSQL_MIGRATION_USERNAME: ${MYSQL_MIGRATION_USERNAME:-${MYSQL_USERNAME:?Set MYSQL_USERNAME}}
      MYSQL_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:-${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}}
      POSTGRES_ENABLED: ${POSTGRES_ENABLED:-false}
      POSTGRES_URL: ${POSTGRES_URL:-}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-10}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
      REDIS_HOST: ${REDIS_HOST:?Set REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-5s}
      REDIS_SSL: ${REDIS_SSL:-true}
      APP_TOKEN_SECRET: ${APP_TOKEN_SECRET:?Set APP_TOKEN_SECRET}
      APP_SESSION_COOKIE_SECURE: ${APP_SESSION_COOKIE_SECURE:-false}
      APP_PLATFORM_CODE: ${APP_PLATFORM_CODE:-ai-platform}
      APP_PLATFORM_NAME_EN: ${APP_PLATFORM_NAME_EN:-AI Platform}
      APP_PLATFORM_NAME_ZH: ${APP_PLATFORM_NAME_ZH:-AI平台}
      APP_PLATFORM_SHORT_NAME: ${APP_PLATFORM_SHORT_NAME:-AI}
      APP_DEFAULT_LOCALE: ${APP_DEFAULT_LOCALE:-en-US}
      APP_TOKEN_EXPIRE_MINUTES: ${APP_TOKEN_EXPIRE_MINUTES:-720}
      APP_SEED_ADMIN_USERNAME: ${APP_SEED_ADMIN_USERNAME:-admin}
      APP_SEED_ADMIN_PASSWORD: ${APP_SEED_ADMIN_PASSWORD:-}
      APP_SEED_ADMIN_PASSWORD_FILE: /app/bootstrap/admin-password
      APP_SEED_ADMIN_PASSWORD_SYNC_ENABLED: ${APP_SEED_ADMIN_PASSWORD_SYNC_ENABLED:-false}
      APP_CONFIG_ENCRYPTION_KEY: ${APP_CONFIG_ENCRYPTION_KEY:?Set APP_CONFIG_ENCRYPTION_KEY}
      APP_CONFIG_ENCRYPTION_KEYS: ${APP_CONFIG_ENCRYPTION_KEYS:-}
      APP_CONFIG_ENCRYPTION_ACTIVE_KEY_ID: ${APP_CONFIG_ENCRYPTION_ACTIVE_KEY_ID:-legacy}
      DEVICE_AGENT_NONCE_TTL_SECONDS: ${DEVICE_AGENT_NONCE_TTL_SECONDS:-600}
      DEVICE_AGENT_SIGNATURE_CLOCK_SKEW_SECONDS: ${DEVICE_AGENT_SIGNATURE_CLOCK_SKEW_SECONDS:-300}
      DEVICE_AGENT_HEARTBEAT_STALE_SECONDS: ${DEVICE_AGENT_HEARTBEAT_STALE_SECONDS:-180}
      DEVICE_AGENT_PAIRING_TTL_SECONDS: ${DEVICE_AGENT_PAIRING_TTL_SECONDS:-900}
      DEVICE_AGENT_REGISTRY_DEFAULT_PORT: ${DEVICE_AGENT_REGISTRY_DEFAULT_PORT:-42314}
      APP_API_KEY_HASH_SECRET: ${APP_API_KEY_HASH_SECRET:?Set APP_API_KEY_HASH_SECRET}
      APP_TRUSTED_PROXY_CIDRS: ${APP_TRUSTED_PROXY_CIDRS:-${APP_NETWORK_SUBNET:-172.30.0.0/24}}
      APP_LOGIN_ACCOUNT_IP_FAILURES: ${APP_LOGIN_ACCOUNT_IP_FAILURES:-5}
      APP_LOGIN_IP_FAILURES: ${APP_LOGIN_IP_FAILURES:-20}
      APP_LOGIN_WINDOW_MINUTES: ${APP_LOGIN_WINDOW_MINUTES:-5}
      APP_LOGIN_BLOCK_MINUTES: ${APP_LOGIN_BLOCK_MINUTES:-15}
      APP_SECRET_REVEAL_FAILURES: ${APP_SECRET_REVEAL_FAILURES:-5}
      APP_SECRET_REVEAL_WINDOW_MINUTES: ${APP_SECRET_REVEAL_WINDOW_MINUTES:-5}
      APP_SECRET_REVEAL_BLOCK_MINUTES: ${APP_SECRET_REVEAL_BLOCK_MINUTES:-15}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      APP_PASSWORD_MIN_LENGTH: ${APP_PASSWORD_MIN_LENGTH:-12}
      APP_MAX_REQUEST_BYTES: ${APP_MAX_REQUEST_BYTES:-67108864}
      APP_AUTH_REQUEST_MAX_BYTES: ${APP_AUTH_REQUEST_MAX_BYTES:-65536}
      APP_MAX_REQUEST_HEADER_SIZE: ${APP_MAX_REQUEST_HEADER_SIZE:-16KB}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-}
      OSS_PREFIX: ${OSS_PREFIX:-public/}
      KNOWLEDGE_UPLOAD_MAX_BYTES: ${KNOWLEDGE_UPLOAD_MAX_BYTES:-10485760}
      KNOWLEDGE_UPLOAD_REQUEST_MAX_BYTES: ${KNOWLEDGE_UPLOAD_REQUEST_MAX_BYTES:-11534336}
      DOCUMENT_PARSER_SOCKET: /run/document-parser/parser.sock
      DOCUMENT_PARSER_MAX_BYTES: ${DOCUMENT_PARSER_MAX_BYTES:-10485760}
      DOCUMENT_PARSER_MAX_CHARACTERS: ${DOCUMENT_PARSER_MAX_CHARACTERS:-2000000}
      PYTHON_WORKER_URL: ${PYTHON_WORKER_URL:-http://python-worker:8000}
      PYTHON_WORKER_INTERNAL_TOKEN: ${PYTHON_WORKER_INTERNAL_TOKEN:?Set PYTHON_WORKER_INTERNAL_TOKEN}
      JAVA_INSTANCE_ID: ${JAVA_INSTANCE_ID:-java-backend-1}
      LLM_ROUTE_HEALTH_CHECK_ENABLED: ${LLM_ROUTE_HEALTH_CHECK_ENABLED:-true}
      LLM_ROUTE_HEALTH_CHECK_INTERVAL_MS: ${LLM_ROUTE_HEALTH_CHECK_INTERVAL_MS:-3600000}
      TRACE_LOG_PERSIST_LEVEL: ${TRACE_LOG_PERSIST_LEVEL:-INFO}
      TRACE_LOG_QUEUE_CAPACITY: ${TRACE_LOG_QUEUE_CAPACITY:-10000}
      TRACE_LOG_BATCH_SIZE: ${TRACE_LOG_BATCH_SIZE:-100}
      TRACE_LOG_FLUSH_INTERVAL_MS: ${TRACE_LOG_FLUSH_INTERVAL_MS:-500}
      TRACE_LOG_RETENTION_DAYS: ${TRACE_LOG_RETENTION_DAYS:-7}
      AUDIT_OPERATION_LOG_RETENTION_DAYS: ${AUDIT_OPERATION_LOG_RETENTION_DAYS:-90}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_CONSOLE_QUEUE_CAPACITY: ${LOG_CONSOLE_QUEUE_CAPACITY:-8192}
      TRACE_HEARTBEAT_TIMEOUT_SECONDS: ${TRACE_HEARTBEAT_TIMEOUT_SECONDS:-120}
      TRACE_TRACKING_EXCLUSIONS_FILE: /app/config/trace-tracking-exclusions.yml
      API_TRIGGER_SCHEDULER_POOL_SIZE: ${API_TRIGGER_SCHEDULER_POOL_SIZE:-4}
      API_TRIGGER_LOCK_SECONDS: ${API_TRIGGER_LOCK_SECONDS:-300}
      API_TRIGGER_RESULT_MAX_LENGTH: ${API_TRIGGER_RESULT_MAX_LENGTH:-2000}
      API_TRIGGER_RESPONSE_MAX_BYTES: ${API_TRIGGER_RESPONSE_MAX_BYTES:-2097152}
      API_TRIGGER_REQUEST_BODY_MAX_BYTES: ${API_TRIGGER_REQUEST_BODY_MAX_BYTES:-1048576}
      API_TRIGGER_METADATA_MAX_LENGTH: ${API_TRIGGER_METADATA_MAX_LENGTH:-65536}
      WORKFLOW_EXECUTOR_POOL_SIZE: ${WORKFLOW_EXECUTOR_POOL_SIZE:-4}
      WORKFLOW_EXECUTOR_QUEUE_CAPACITY: ${WORKFLOW_EXECUTOR_QUEUE_CAPACITY:-400}
      WORKFLOW_MAX_NODES: ${WORKFLOW_MAX_NODES:-100}
      WORKFLOW_MAX_ITERATIONS: ${WORKFLOW_MAX_ITERATIONS:-100}
      WORKFLOW_MAX_AGENT_STEPS: ${WORKFLOW_MAX_AGENT_STEPS:-20}
      WORKFLOW_MAX_RECURSION_DEPTH: ${WORKFLOW_MAX_RECURSION_DEPTH:-5}
      WORKFLOW_MAX_PAYLOAD_BYTES: ${WORKFLOW_MAX_PAYLOAD_BYTES:-1048576}
      WORKFLOW_MAX_WAIT_SECONDS: ${WORKFLOW_MAX_WAIT_SECONDS:-3600}
      WORKFLOW_MAX_EXECUTION_STEPS: ${WORKFLOW_MAX_EXECUTION_STEPS:-1000}
      WORKFLOW_MAX_RUN_DURATION_SECONDS: ${WORKFLOW_MAX_RUN_DURATION_SECONDS:-86400}
      WORKFLOW_MAX_RUN_LOG_BYTES: ${WORKFLOW_MAX_RUN_LOG_BYTES:-10485760}
      WORKFLOW_LEASE_SECONDS: ${WORKFLOW_LEASE_SECONDS:-60}
      WORKFLOW_WEBHOOK_MAX_BODY_BYTES: ${WORKFLOW_WEBHOOK_MAX_BODY_BYTES:-1048576}
      WORKFLOW_WEBHOOK_RATE_LIMIT_PER_MINUTE: ${WORKFLOW_WEBHOOK_RATE_LIMIT_PER_MINUTE:-60}
      WORKFLOW_TRIGGER_DELIVERY_RETENTION_DAYS: ${WORKFLOW_TRIGGER_DELIVERY_RETENTION_DAYS:-30}
      WORKFLOW_RUN_RETENTION_DAYS: ${WORKFLOW_RUN_RETENTION_DAYS:-30}
    volumes:
      - ${TRACE_TRACKING_EXCLUSIONS_FILE:-./backend/config/trace-tracking-exclusions.yml}:/app/config/trace-tracking-exclusions.yml:ro
      - bootstrap-secrets:/app/bootstrap
      - document-parser-control:/run/document-parser:ro
    depends_on:
      document-parser:
        condition: service_healthy
      python-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/open/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
    stop_signal: SIGTERM
    stop_grace_period: 20s
    networks:
      - app-network

  # Docker API proxy exposes only the operations required by deployment-agent.
  python-worker:
    build:
      context: ./python-worker
      args:
        APP_IMAGE_REVISION: ${APP_IMAGE_REVISION:?Set APP_IMAGE_REVISION to Git commit}
        PYTHON_IMAGE: python:3.12-slim@sha256:09f7da3bc104798d0afb40bc08d23ab2da20a76130cec1f2ef170848f5d85217
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
    image: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-python-worker:${APP_IMAGE_REVISION:?Set APP_IMAGE_REVISION to Git commit}
    container_name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-python-worker
    restart: unless-stopped
    # 为模型供应商域名提供外部解析，避免宿主 Docker 未配置上游 DNS 时调用失败。
    dns:
      - 223.5.5.5
      - 1.1.1.1
    mem_limit: ${PYTHON_WORKER_MEMORY_LIMIT:-1g}
    cpus: ${PYTHON_WORKER_CPU_LIMIT:-2.0}
    pids_limit: ${PYTHON_WORKER_PIDS_LIMIT:-256}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      BACKEND_URL: http://backend:8080
      PYTHON_WORKER_INTERNAL_TOKEN: ${PYTHON_WORKER_INTERNAL_TOKEN:?Set PYTHON_WORKER_INTERNAL_TOKEN}
      PYTHON_WORKER_INSTANCE_ID: ${PYTHON_WORKER_INSTANCE_ID:-python-worker-1}
      APP_PLATFORM_NAME_EN: ${APP_PLATFORM_NAME_EN:-AI Platform}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_LOG_CONTENT: ${LLM_LOG_CONTENT:-false}
      WORKER_MAX_REQUEST_BYTES: ${WORKER_MAX_REQUEST_BYTES:-67108864}
      LLM_RESPONSE_MAX_BYTES: ${LLM_RESPONSE_MAX_BYTES:-10485760}
      TRACE_LOG_PERSIST_LEVEL: ${TRACE_LOG_PERSIST_LEVEL:-INFO}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_signal: SIGTERM
    stop_grace_period: 20s
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      additional_contexts:
        agent-src: ./device-agent
      args:
        APP_IMAGE_REVISION: ${APP_IMAGE_REVISION:?Set APP_IMAGE_REVISION to Git commit}
        NODE_IMAGE: node:24-alpine@sha256:e67514e5d0f6c46656005e1b693b2ec9d52e80b641307de684d4a015ba7a4eaf
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
        AGENT_RUNTIME_BUNDLE: ${AGENT_RUNTIME_BUNDLE:-true}
        AGENT_PYTHON_VERSION: ${AGENT_PYTHON_VERSION:-3.12.8}
        AGENT_PYTHON_TAG: ${AGENT_PYTHON_TAG:-20250106}
        AGENT_PYTHON_BASE_URL: ${AGENT_PYTHON_BASE_URL:-https://github.com/astral-sh/python-build-standalone/releases/download}
        AGENT_NODE_VERSION: ${AGENT_NODE_VERSION:-22.22.0}
        AGENT_NODE_BASE_URL: ${AGENT_NODE_BASE_URL:-https://nodejs.org/dist}
        AGENT_APPIUM_SPEC: ${AGENT_APPIUM_SPEC:-appium@3.7.0}
        AGENT_XCUITEST_SPEC: ${AGENT_XCUITEST_SPEC:-xcuitest@12.11.1}
    image: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-frontend:${APP_IMAGE_REVISION:?Set APP_IMAGE_REVISION to Git commit}
    container_name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-frontend
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
    cpus: ${FRONTEND_CPU_LIMIT:-1.0}
    pids_limit: ${FRONTEND_PIDS_LIMIT:-128}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: ${FRONTEND_BACKEND_URL:-http://backend:8080}
      APP_PLATFORM_CODE: ${APP_PLATFORM_CODE:-ai-platform}
      APP_PLATFORM_NAME_EN: ${APP_PLATFORM_NAME_EN:-AI Platform}
      APP_PLATFORM_NAME_ZH: ${APP_PLATFORM_NAME_ZH:-AI平台}
      APP_PLATFORM_SHORT_NAME: ${APP_PLATFORM_SHORT_NAME:-AI}
      APP_DEFAULT_LOCALE: ${APP_DEFAULT_LOCALE:-en-US}
      LLM_ROUTE_HEALTH_CHECK_ENABLED: ${LLM_ROUTE_HEALTH_CHECK_ENABLED:-true}
      LLM_ROUTE_HEALTH_CHECK_INTERVAL_MS: ${LLM_ROUTE_HEALTH_CHECK_INTERVAL_MS:-3600000}
      PORT: 8080
    ports:
      - "${HTTP_PORT:-80}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${APP_NETWORK_SUBNET:-172.30.0.0/24}
  outbound-network:
    driver: bridge
    internal: true
    driver: bridge
    internal: true

volumes:
  adapter-control:
  adapter-broker-control:
  bootstrap-secrets:
  document-parser-control:
